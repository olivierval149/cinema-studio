<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinéma Studio - IA Video</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: var(--bg-color); color: var(--text); padding: 16px; max-width: 600px; margin: 0 auto; padding-bottom: 40px; }
    h1 { text-align: center; color: var(--accent); margin-bottom: 20px; font-size: 1.5rem; }
    .section { background: var(--card-bg); border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border); }
    .section-title { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; }
    
    .api-container { display: flex; gap: 8px; }
    input[type="password"], textarea, select, input[type="file"] { width: 100%; padding: 12px; background: var(--bg-color); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 0.95rem; outline: none; }
    textarea { resize: vertical; min-height: 80px; margin-bottom: 12px; }

    .btn { background: var(--accent); color: white; border: none; padding: 12px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .btn-full { width: 100%; padding: 14px; font-size: 1rem; margin-top: 10px; }
    .status-msg { margin-top: 8px; font-size: 0.85rem; color: var(--success); display: none; font-weight: 600; }

    .mode-toggle { display: flex; background: var(--bg-color); border-radius: 8px; padding: 4px; border: 1px solid var(--border); margin-bottom: 12px; }
    .mode-btn { flex: 1; padding: 8px; border: none; background: transparent; color: var(--text-muted); border-radius: 6px; font-weight: 600; cursor: pointer; }
    .mode-btn.active { background: var(--accent); color: white; }

    .grid-effects { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .effect-chip { background: var(--bg-color); border: 1px solid var(--border); padding: 10px; border-radius: 8px; font-size: 0.85rem; text-align: center; cursor: pointer; user-select: none; }
    .effect-chip.selected { border-color: var(--accent); background: rgba(99, 102, 241, 0.2); }

    .image-preview { width: 100%; max-height: 200px; object-fit: cover; border-radius: 8px; margin-top: 10px; display: none; }
  </style>
</head>
<body>

  <h1>🎬 Cinéma Studio</h1>

  <!-- CONFIGURATION API -->
  <div class="section">
    <div class="section-title">Clé API</div>
    <div class="api-container">
      <input type="password" id="apiKey" placeholder="Saisir votre Clé API...">
      <button class="btn" onclick="saveKey()">Valider</button>
    </div>
    <div id="statusMsg" class="status-msg">✓ Clé API enregistrée !</div>
  </div>

  <!-- PARAMÈTRES VIDÉO -->
  <div class="section">
    <div class="section-title">Paramètres Réglages</div>
    <div class="mode-toggle">
      <button class="mode-btn active" id="btnAuto" onclick="setMode('auto')">Auto</button>
      <button class="mode-btn" id="btnManuel" onclick="setMode('manuel')">Manuel</button>
    </div>

    <div class="section-title" style="margin-top: 10px;">Durée de la vidéo</div>
    <select id="durationSelect" style="margin-bottom: 12px;">
      <option value="5">5 secondes</option>
      <option value="10" selected>10 secondes</option>
      <option value="15">15 secondes</option>
      <option value="30">30 secondes</option>
    </select>

    <div class="section-title">Voix Off (10 Options)</div>
    <select id="voiceSelect">
      <option value="v1">Voix 1 - Narrative Masculine</option>
      <option value="v2">Voix 2 - Narrative Féminine</option>
      <option value="v3">Voix 3 - Dynamique</option>
      <option value="v4">Voix 4 - Calme & Électronique</option>
      <option value="v5">Voix 5 - Cinématique Grave</option>
      <option value="v6">Voix 6 - Documentaire</option>
      <option value="v7">Voix 7 - Énergique</option>
      <option value="v8">Voix 8 - Douce</option>
      <option value="v9">Voix 9 - Théâtrale</option>
      <option value="v10">Voix 10 - Radio</option>
    </select>
  </div>

  <!-- IMPORT IMAGE & PROMPTS -->
  <div class="section">
    <div class="section-title">Image & Scénario</div>
    <label class="section-title" style="display:block; margin-bottom: 6px;">Importer une image source :</label>
    <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)">
    <img id="imagePreview" class="image-preview" alt="Aperçu image">

    <textarea id="promptVisual" placeholder="Description du visuel / Prompt..." style="margin-top:12px;"></textarea>
    <textarea id="promptAudio" placeholder="Texte de la voix off / Scénario..."></textarea>
  </div>

  <!-- EFFETS SONORES -->
  <div class="section">
    <div class="section-title">Effets Sonores (12)</div>
    <div class="grid-effects">
      <div class="effect-chip" onclick="toggleEffect(this)">💥 Explosion</div>
      <div class="effect-chip" onclick="toggleEffect(this)">🌧️ Pluie</div>
      <div class="effect-chip" onclick="toggleEffect(this)">💨 Vent</div>
      <div class="effect-chip" onclick="toggleEffect(this)">🔥 Feu</div>
      <div class="effect-chip" onclick="toggleEffect(this)">⚡ Éclair</div>
      <div class="effect-chip" onclick="toggleEffect(this)">🚗 Moteur</div>
      <div class="effect-chip" onclick="toggleEffect(this)">🌊 Vagues</div>
      <div class="effect-chip" onclick="toggleEffect(this)">🐦 Oiseaux</div>
      <div class="effect-chip" onclick="toggleEffect(this)">🔔 Cloche</div>
      <div class="effect-chip" onclick="toggleEffect(this)">👣 Pas</div>
      <div class="effect-chip" onclick="toggleEffect(this)">🚪 Porte</div>
      <div class="effect-chip" onclick="toggleEffect(this)">👏 Applaudissements</div>
    </div>
  </div>

  <button class="btn btn-full" onclick="generateProject()">🚀 Générer</button>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const savedKey = localStorage.getItem("cinema_api_key");
      if (savedKey) document.getElementById("apiKey").value = savedKey;
    });

    function saveKey() {
      const key = document.getElementById("apiKey").value;
      if (!key) { alert("Veuillez entrer une clé API."); return; }
      localStorage.setItem("cinema_api_key", key);
      const msg = document.getElementById("statusMsg");
      msg.style.display = "block";
      setTimeout(() => { msg.style.display = "none"; }, 3000);
    }

    function setMode(mode) {
      document.getElementById("btnAuto").classList.toggle("active", mode === 'auto');
      document.getElementById("btnManuel").classList.toggle("active", mode === 'manuel');
    }

    function toggleEffect(el) {
      el.classList.toggle("selected");
    }

    function previewImage(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = document.getElementById("imagePreview");
          img.src = e.target.result;
          img.style.display = "block";
        }
        reader.readAsDataURL(file);
      }
    }

    function generateProject() {
      const key = localStorage.getItem("cinema_api_key");
      if (!key) {
        alert("Veuillez d'abord saisir et valider votre Clé API !");
        return;
      }
      alert("Prêt à l'emploi avec votre clé et vos paramètres !");
    }
  </script>

</body>
</html>
