<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinéma Studio - IA Video</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
            padding-bottom: 40px;
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: var(--accent);
        }

        .section {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }

        .section-title {
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        input[type="password"], input[type="text"], select, textarea {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.95rem;
            margin-bottom: 10px;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .toggle-btn {
            display: flex;
            background: #0f172a;
            border-radius: 8px;
            padding: 4px;
            border: 1px solid var(--border);
        }

        .toggle-btn button {
            padding: 8px 16px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }

        .toggle-btn button.active {
            background: var(--accent);
            color: white;
        }

        .fx-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .fx-btn {
            background: #0f172a;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 6px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            text-align: center;
        }

        .fx-btn:active {
            background: var(--accent);
        }

        .duration-selector {
            display: flex;
            gap: 10px;
        }

        .duration-btn {
            flex: 1;
            padding: 10px;
            background: #0f172a;
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
        }

        .duration-btn.active {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.2);
            color: var(--accent);
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .gallery-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-item .delete-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(239, 68, 68, 0.8);
            color: white;
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            line-height: 22px;
            text-align: center;
        }

        .generate-btn {
            width: 100%;
            padding: 16px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
        }

        .generate-btn:hover {
            background: var(--accent-hover);
        }

        input[type="file"] {
            display: none;
        }

        .upload-label {
            display: block;
            padding: 12px;
            background: #0f172a;
            border: 1px dashed var(--border);
            border-radius: 8px;
            text-align: center;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <h1>🎬 Cinéma Studio</h1>

    <!-- 1. Clé API -->
    <div class="section">
        <div class="section-title">Configuration</div>
        <input type="password" id="apiKey" placeholder="Clé API vidéo / voice" oninput="saveApiKey(this.value)">
    </div>

    <!-- 2. Mode & Voix -->
    <div class="section">
        <div class="toggle-container">
            <span class="section-title" style="margin:0;">Mode</span>
            <div class="toggle-btn">
                <button id="modeAuto" class="active" onclick="setMode('auto')">Auto</button>
                <button id="modeManual" onclick="setMode('manual')">Manuel</button>
            </div>
        </div>

        <div class="section-title" style="margin-top:12px;">Voix Off (10 Options)</div>
        <select id="voiceSelect">
            <option value="v1">Voix 1 - Narrative Masculine</option>
            <option value="v2">Voix 2 - Narrative Féminine</option>
            <option value="v3">Voix 3 - Cinématique Grave</option>
            <option value="v4">Voix 4 - Dynamique Jeune</option>
            <option value="v5">Voix 5 - Douce & Calme</option>
            <option value="v6">Voix 6 - Documentaire</option>
            <option value="v7">Voix 7 - Enjouée</option>
            <option value="v8">Voix 8 - Autoritaire</option>
            <option value="v9">Voix 9 - Chuchotée</option>
            <option value="v10">Voix 10 - Bande-Annonce</option>
        </select>
    </div>

    <!-- 3. Prompts & Scénario -->
    <div class="section">
        <div class="section-title">Texte & Scénario</div>
        <textarea id="promptInput" placeholder="Description du visuel (Prompt)..."></textarea>
        <textarea id="scriptInput" placeholder="Texte de la voix off / Scénario..."></textarea>
    </div>

    <!-- 4. Effets Sonores (12 Triggers) -->
    <div class="section">
        <div class="section-title">Effets Sonores (12)</div>
        <div class="fx-grid">
            <button class="fx-btn" onclick="triggerFX('Explosion')">💥 Explosion</button>
            <button class="fx-btn" onclick="triggerFX('Pluie')">🌧️ Pluie</button>
            <button class="fx-btn" onclick="triggerFX('Vent')">💨 Vent</button>
            <button class="fx-btn" onclick="triggerFX('Moteur')">🏎️ Moteur</button>
            <button class="fx-btn" onclick="triggerFX('Rire')">😂 Rire</button>
            <button class="fx-btn" onclick="triggerFX('Applaudissements')">👏 Applaud.</button>
            <button class="fx-btn" onclick="triggerFX('Tension')">🎻 Tension</button>
            <button class="fx-btn" onclick="triggerFX('Swoosh')">⚡ Swoosh</button>
            <button class="fx-btn" onclick="triggerFX('Impact')">🔨 Impact</button>
            <button class="fx-btn" onclick="triggerFX('Cinématique')">🎵 Synth</button>
            <button class="fx-btn" onclick="triggerFX('Pas')">🚶 Pas</button>
            <button class="fx-btn" onclick="triggerFX('Cœur')">💓 Cœur</button>
        </div>
    </div>

    <!-- 5. Images -->
    <div class="section">
        <div class="section-title">Galerie d'images</div>
        <label for="imageUpload" class="upload-label">➕ Ajouter une ou plusieurs images</label>
        <input type="file" id="imageUpload" accept="image/*" multiple onchange="handleImageUpload(event)">
        <div class="gallery" id="imageGallery"></div>
    </div>

    <!-- 6. Durée -->
    <div class="section">
        <div class="section-title">Durée de la vidéo</div>
        <div class="duration-selector">
            <div class="duration-btn active" onclick="setDuration(5, this)">5s</div>
            <div class="duration-btn" onclick="setDuration(10, this)">10s</div>
            <div class="duration-btn" onclick="setDuration(15, this)">15s</div>
        </div>
    </div>

    <!-- Bouton Générer -->
    <button class="generate-btn" onclick="generateVideo()">🚀 GÉNÉRER LA VIDÉO</button>

    <script>
        let selectedDuration = 5;
        let selectedMode = 'auto';

        // Charger la clé API enregistrée au démarrage
        window.onload = function() {
            const savedKey = localStorage.getItem('cinema_api_key');
            if (savedKey) {
                document.getElementById('apiKey').value = savedKey;
            }
        };

        function saveApiKey(key) {
            localStorage.setItem('cinema_api_key', key);
        }

        function setMode(mode) {
            selectedMode = mode;
            document.getElementById('modeAuto').classList.toggle('active', mode === 'auto');
            document.getElementById('modeManual').classList.toggle('active', mode === 'manual');
        }

        function setDuration(sec, element) {
            selectedDuration = sec;
            document.querySelectorAll('.duration-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }

        function triggerFX(name) {
            alert("Effet sonore ajouté : " + name);
        }

        function handleImageUpload(event) {
            const files = event.target.files;
            const gallery = document.getElementById('imageGallery');

            for (let file of files) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const item = document.createElement('div');
                    item.className = 'gallery-item';
                    item.innerHTML = `
                        <img src="${e.target.result}" alt="Image">
                        <button class="delete-btn" onclick="this.parentElement.remove()">✕</button>
                    `;
                    gallery.appendChild(item);
                };
                reader.readAsDataURL(file);
            }
        }

        function generateVideo() {
            const key = document.getElementById('apiKey').value;
            if (!key) {
                alert("Veuillez saisir votre clé API.");
                return;
            }
            alert(`Génération lancée en mode ${selectedMode.toUpperCase()} (${selectedDuration}s) !`);
        }
    </script>

</body>
</html>
