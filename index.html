<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinéma Studio - IA Video</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --danger: #ef4444;
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
      padding-bottom: 40px;
    }

    h1 {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .section {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }

    .section-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .api-container {
      display: flex;
      gap: 8px;
    }

    input[type="password"], textarea, select {
      width: 100%;
      padding: 12px;
      background: var(--bg-color);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    input[type="password"]:focus, textarea:focus, select:focus {
      border-color: var(--accent);
    }

    .btn-valider {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .status-msg {
      margin-top: 8px;
      font-size: 0.85rem;
      color: var(--success);
      display: none;
      font-weight: 600;
    }

    .mode-toggle {
      display: flex;
      background: var(--bg-color);
      border-radius: 8px;
      padding: 4px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
    }

    .mode-btn {
      flex: 1;
      padding: 8px;
      text-align: center;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }

    .mode-btn.active {
      background: var(--accent);
      color: white;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
      margin-bottom: 12px;
    }

    .sound-effects {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .effect-chip {
      background: var(--bg-color);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      text-align: center;
      cursor: pointer;
    }

    .btn-generate {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>🎬 Cinéma Studio</h1>

  <div class="section">
    <div class="section-title">CONFIGURATION</div>
    <div class="api-container">
      <input type="password" id="apiKey" placeholder="Saisir votre Clé API...">
      <button class="btn-valider" onclick="saveKey()">Valider</button>
    </div>
    <div id="statusMsg" class="status-msg">✓ Clé API enregistrée avec succès !</div>
  </div>

  <div class="section">
    <div class="section-title">MODE</div>
    <div class="mode-toggle">
      <button class="mode-btn active" id="btnAuto" onclick="setMode('auto')">Auto</button>
      <button class="mode-btn" id="btnManuel" onclick="setMode('manuel')">Manuel</button>
    </div>

    <div class="section-title">VOIX OFF (10 OPTIONS)</div>
    <select id="voiceSelect">
      <option>Voix 1 - Narrative Masculine</option>
      <option>Voix 2 - Narrative Féminine</option>
      <option>Voix 3 - Dynamique</option>
      <option>Voix 4 - Calme & Électronique</option>
      <option>Voix 5 - Cinématique Grave</option>
      <option>Voix 6 - Documentaire</option>
      <option>Voix 7 - Énergique</option>
      <option>Voix 8 - Douce</option>
      <option>Voix 9 - Théâtrale</option>
      <option>Voix 10 - Radio</option>
    </select>
  </div>

  <div class="section">
    <div class="section-title">TEXTE & SCÉNARIO</div>
    <textarea placeholder="Description du visuel (Prompt)..."></textarea>
    <textarea placeholder="Texte de la voix off / Scénario..."></textarea>
  </div>

  <div class="section">
    <div class="section-title">EFFETS SONORES (12)</div>
    <div class="sound-effects">
      <div class="effect-chip">💥 Explosion</div>
      <div class="effect-chip">🌧️ Pluie</div>
      <div class="effect-chip">💨 Vent</div>
      <div class="effect-chip">🔥 Feu</div>
      <div class="effect-chip">⚡ Éclair</div>
      <div class="effect-chip">🚗 Moteur</div>
      <div class="effect-chip">🌊 Vagues</div>
      <div class="effect-chip">🐦 Oiseaux</div>
      <div class="effect-chip">🔔 Cloche</div>
      <div class="effect-chip">👣 Pas</div>
      <div class="effect-chip">🚪 Porte</div>
      <div class="effect-chip">👏 Applaudissements</div>
    </div>
  </div>

  <button class="btn-generate">Générer le projet</button>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const savedKey = localStorage.getItem("cinema_api_key");
      if (savedKey) {
        document.getElementById("apiKey").value = savedKey;
      }
    });

    function saveKey() {
      const key = document.getElementById("apiKey").value;
      localStorage.setItem("cinema_api_key", key);
      const msg = document.getElementById("statusMsg");
      msg.style.display = "block";
      setTimeout(() => { msg.style.display = "none"; }, 3000);
    }

    function setMode(mode) {
      document.getElementById("btnAuto").classList.toggle("active", mode === 'auto');
      document.getElementById("btnManuel").classList.toggle("active", mode === 'manuel');
    }
  </script>

</body>
</html>
