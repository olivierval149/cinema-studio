<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Action & Thriller Video Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2 {
            color: #e50914;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="password"], textarea {
            width: 100%;
            padding: 10px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        textarea {
            height: 100px;
            resize: vertical;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #e50914;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #b20710;
        }
        #result {
            margin-top: 20px;
            padding: 10px;
            background: #2d2d2d;
            border-radius: 4px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎬 Action & Thriller Generator</h2>
    
    <div class="form-group">
        <label for="apiKey">Clé API :</label>
        <input type="password" id="apiKey" placeholder="Entre ta clé API ici">
    </div>

    <div class="form-group">
        <label for="prompt">Description de la scène (Action / Thriller) :</label>
        <textarea id="prompt" placeholder="Ex: Course-poursuite nocturne entre deux voitures sportives sous la pluie..."></textarea>
    </div>

    <button onclick="generateVideo()">Générer la vidéo</button>

    <div id="result">
        <p id="statusText">Génération en cours...</p>
    </div>
</div>

<script>
    function generateVideo() {
        const apiKey = document.getElementById('apiKey').value;
        const prompt = document.getElementById('prompt').value;
        const resultDiv = document.getElementById('result');
        const statusText = document.getElementById('statusText');

        if (!apiKey) {
            alert('Veuillez entrer une clé API.');
            return;
        }

        if (!prompt) {
            alert('Veuillez décrire votre scène.');
            return;
        }

        resultDiv.style.display = 'block';
        statusText.innerHTML = "🔄 Connexion à l'API et traitement de la scène d'action...";

        // Simulation de l'appel API (tu pourras remplacer cette logique par la vraie requête fetch vers ton API de vidéo)
        setTimeout(() => {
            statusText.innerHTML = "✅ Requête envoyée avec succès ! (Intègre ici l'affichage de ta vidéo selon l'API utilisée).";
        }, 2000);
    }
</script>

</body>
</html>
