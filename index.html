<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinéma Studio - IA Video</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
      padding-bottom: 40px;
    }

    h1 {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: var(--accent);
    }

    .section {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }

    .section-title {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .api-container {
      display: flex;
      gap: 8px;
    }

    input[type="password"], textarea, select {
      width: 100%;
      padding: 12px;
      background: var(--bg-color);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.95rem;
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .status-msg {
      margin-top: 8px;
      font-size: 0.85rem;
      color: var(--success);
      display: none;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <h1>🎬 Cinéma Studio</h1>

  <div class="section">
    <div class="section-title">Configuration</div>
    <div class="api-container">
      <input type="password" id="apiKey" placeholder="Saisir votre Clé API...">
      <button id="saveBtn" onclick="saveKey()">Valider</button>
    </div>
    <div id="statusMsg" class="status-msg">✓ Clé API enregistrée avec succès !</div>
  </div>

  <div class="section">
    <div class="section-title">Texte & Scénario</div>
    <textarea placeholder="Description du visuel (Prompt)..."></textarea>
    <textarea placeholder="Texte de la voix off / Scénario..."></textarea>
  </div>

  <script>
    // Charger la clé si elle existe déjà
    document.addEventListener("DOMContentLoaded", () => {
      const savedKey = localStorage.getItem("cinema_api_key");
      if (savedKey) {
        document.getElementById("apiKey").value = savedKey;
      }
    });

    function saveKey() {
      const key = document.getElementById("apiKey").value;
      localStorage.setItem("cinema_api_key", key);
      const msg = document.getElementById("statusMsg");
      msg.style.display = "block";
      setTimeout(() => { msg.style.display = "none"; }, 3000);
    }
  </script>

</body>
</html>
